<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
    <style>
        
        .user,.password,.button{
            height: 20%;
            width: 80%;
            /* border: 1px solid black; */
            margin: auto;
        }
        p{
            text-align: center;
        }
        input{
            width: 100%;
            height: 50%;
            /* background-color: lightgray; */
            border-radius: 10px;
            box-shadow: none;
            border: none;
            border: 1px solid gray;

        }
        h1{
            margin: 10% 0 10% 0;
        }
        .login{
            color: white;

            background: linear-gradient(90deg,skyblue , violet);
        }
    </style>
</head>

<body>
    
    <div class="box">
        <form action="">
            <h1 align="center">Login Form</h1>
            
            <div class="user">
                <label for="">Email Or Phone</label>
                <input type="text" placeholder="xyz@gmail.com">
            </div>
            <div class="password">
                <label for="">Password</label>
                <input type="password" placeholder="xyz@123">
            </div>
            <div class="button">
                <label for=""> forget Password</label>
                <input type="submit" class="login" value="LOGIN " >
            </div>
            <p>Not a Member ? <a href="signup.html">Sign Up</a></p>
        </form>
    </div>
</body>
</html>
